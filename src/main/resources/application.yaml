app:
  fixture:
    enabled: true
    tags: [ "contract/basic", "fill/basic" ]
  contract:
    enable-cleanup: true

spring:
  application:
    name: modulith-refactor-demo
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  modulith:
    runtime:
      flyway-enabled: true
  flyway:
    enabled: true

logging:
  level:
    org.flywaydb: DEBUG